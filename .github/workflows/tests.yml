name: HabitClik checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check avisos.js
          node --check alarm-sounds.js
          node --check phrases.js
          node --check sw.js
      - name: Run automated tests
        run: node --test tests/*.test.cjs
