name: Vendor friendly Nunito Sans typography
on:
  push:
    paths:
      - .github/workflows/vendor-font.yml

permissions:
  contents: write

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download OFL-licensed variable font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts /tmp/habitclik-font
          cd /tmp/habitclik-font
          npm pack '@fontsource-variable/nunito-sans@5.3.0' --silent > /tmp/fontpack-filename
          tar -xf "$(cat /tmp/fontpack-filename)"
          test -f package/LICENSE
          test -s package/files/nunito-sans-latin-wght-normal.woff2
          cp package/files/nunito-sans-latin-wght-normal.woff2 "$GITHUB_WORKSPACE/fonts/nunito-sans-latin-wght-normal.woff2"
          cp package/LICENSE "$GITHUB_WORKSPACE/fonts/OFL-LICENSE.txt"
          test "$(stat -c%s "$GITHUB_WORKSPACE/fonts/nunito-sans-latin-wght-normal.woff2")" -gt 20000
      - name: Commit app typography
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/nunito-sans-latin-wght-normal.woff2 fonts/OFL-LICENSE.txt
          if ! git diff --cached --quiet; then
            git commit -m "assets(font): vendor open-license Nunito Sans for Android and offline web"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
