name: Android preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-preview.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build unsigned-for-store debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout HabitClik
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Capacitor build dependencies
        run: npm install --no-audit --no-fund
      - name: Test static app and Android packaging
        run: npm test
      - name: Bundle and initialize preview Android project
        run: |
          npm run android:preview
      - name: Check Android 16 target SDK
        run: |
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Assemble installable DEBUG APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Confirm APK and integrity
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for Android testers
        uses: actions/upload-artifact@v4
        with:
          name: HabitClik-Android-PRUEBAS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
