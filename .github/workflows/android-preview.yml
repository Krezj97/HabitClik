name: Android preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-preview.yml
      - index.html
      - avisos.html
      - privacy.html
      - app.js
      - avisos.js
      - alarm-sounds.js
      - native-notifications.js
      - native-backup.js
      - phrases.js
      - progress.js
      - styles.css
      - art/**
      - fonts/**
      - sw.js
      - manifest.webmanifest
      - android/prepare-web.cjs
      - capacitor.config.json
      - package.json
      - tests/**

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build unsigned-for-store debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout HabitClik
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 16 SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-not configured}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Capacitor build dependencies
        run: npm install --no-audit --no-fund
      - name: Remove privileged exact-alarm permissions from preview
        run: |
          set -euo pipefail
          manifest="node_modules/@capacitor/local-notifications/android/src/main/AndroidManifest.xml"
          test -f "$manifest"
          sed -i '/SCHEDULE_EXACT_ALARM/d; /USE_EXACT_ALARM/d' "$manifest"
          ! grep -E 'SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM' "$manifest"
      - name: Test static app and Android packaging
        run: npm test
      - name: Keep Android docs separate from generated native project
        run: |
          test -d android
          test ! -e android-native
      - name: Bundle and initialize preview Android project
        run: |
          npm run android:preview
      - name: Use HabitClik launcher branding instead of Capacitor defaults
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android-native/app/src/main/res/mipmap-${density}"
            test -d "$target"
            for icon in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              cp icons/icon-512.png "$target/$icon"
            done
          done
      - name: Install licensed alarm tones as Android notification sounds
        run: |
          set -euo pipefail
          mkdir -p android-native/app/src/main/res/raw
          for tone in campanas digital clasica alegre energia; do
            cp "sounds/${tone}.mp3" "android-native/app/src/main/res/raw/hc_${tone}.mp3"
            test -s "android-native/app/src/main/res/raw/hc_${tone}.mp3"
          done
      - name: Check Android 16 target SDK
        run: |
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android-native/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android-native/variables.gradle
          grep -R -q 'LocalNotificationsPlugin' android-native/app/src/main/assets/capacitor.plugins.json
          grep -R -q 'POST_NOTIFICATIONS' node_modules/@capacitor/local-notifications/android/src/main/AndroidManifest.xml
      - name: Assemble installable DEBUG APK
        working-directory: android-native
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Confirm APK and integrity
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import zipfile
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              manifest=z.read("AndroidManifest.xml")
              assert "android.permission.POST_NOTIFICATIONS".encode("utf-16le") in manifest, "Missing Android notification permission"
              for privileged in ("SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM"):
                  assert privileged.encode("utf-16le") not in manifest, "Unexpected privileged exact alarm permission: " + privileged
              assert any(path.startswith("res/raw/hc_campanas") for path in z.namelist()), "Missing native notification sound"
              assert any(path.endswith("assets/capacitor.plugins.json") for path in z.namelist()), "Missing Capacitor plugin registry"
          print("Android notifications configured without exact-alarm privileges")
          PY
      - name: Upload debug APK for Android testers
        uses: actions/upload-artifact@v4
        with:
          name: HabitClik-Android-PRUEBAS-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
